<!DOCTYPE html>
<html lang="id" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYBOX SIDOARJO</title>
<style>
  :root {
    --bg: #05070a;
    --card: #0e1118;
    --line: #1e2630;
    --text: #ffffff;
    --muted: #8b95a3;
    --dim: #5c6672;
    --accent: #ff283c;
    --accent-2: #ff6b7a;
    --amber: #ff9f1c;
    --amber-2: #ffb84d;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #ff4d5e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* ===== BACKGROUND LAYER ===== */
  body {
    background-color: var(--bg);
    background-image:
      /* Radial glow merah di 3 titik */
      radial-gradient(ellipse 60% 50% at 15% 10%, rgba(255, 40, 60, 0.18), transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 90%, rgba(255, 0, 80, 0.15), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(255, 60, 0, 0.08), transparent 70%),
      /* Grid pattern diagonal */
      linear-gradient(rgba(255, 40, 60, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 40, 60, 0.04) 1px, transparent 1px),
      /* Dot pattern */
      radial-gradient(rgba(255, 40, 60, 0.08) 1px, transparent 1px);
    background-size:
      100% 100%,
      100% 100%,
      100% 100%,
      60px 60px,
      60px 60px,
      20px 20px;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Scanline halus (efek CRT) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 40, 60, 0.025) 0px,
      rgba(255, 40, 60, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Glow bergerak di background (animasi) */
  body::after {
    content: "";
    position: fixed;
    inset: -10%;
    background:
      radial-gradient(circle at 30% 40%, rgba(255, 40, 60, 0.15), transparent 30%),
      radial-gradient(circle at 70% 60%, rgba(255, 0, 80, 0.12), transparent 30%);
    pointer-events: none;
    z-index: 0;
    animation: bgMove 20s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(3%, -2%) scale(1.05); }
    100% { transform: translate(-2%, 3%) scale(1); }
  }

  a { color: inherit; text-decoration: none; }

  /* ===== HEADER ===== */
  #brand {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 14px 12px 12px;
    background: rgba(8, 8, 12, 0.85);
    border-bottom: 1px solid rgba(255, 40, 60, 0.35);
    box-shadow: 0 0 32px rgba(255, 40, 60, 0.15);
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #brand-inner {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  #brand img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    filter: drop-shadow(0 0 8px rgba(255, 40, 60, 0.7));
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%, 100% {
      box-shadow:
        0 0 12px rgba(255, 40, 60, 0.5),
        0 0 24px rgba(255, 40, 60, 0.2);
    }
    50% {
      box-shadow:
        0 0 20px rgba(255, 40, 60, 0.9),
        0 0 40px rgba(255, 40, 60, 0.4);
    }
  }
  #brand b {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #ffffff;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 18px rgba(255, 40, 60, 0.5);
  }
  #brand .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
  }
  #brand::after {
    content: "";
    display: block;
    height: 1px;
    margin-top: 10px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 40, 60, 0.7) 50%,
      transparent 100%
    );
  }

  /* ===== MAIN ===== */
  #wrap {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1 1 auto;
    padding: 24px 18px;
    min-height: 0;
  }

  /* ===== CARD ===== */
  #card {
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid rgba(255, 40, 60, 0.35);
    border-radius: 16px;
    padding: 36px 24px 32px;
    background: linear-gradient(
      180deg,
      rgba(14, 17, 24, 0.95) 0%,
      rgba(10, 8, 12, 0.92) 100%
    );
    box-shadow:
      0 0 0 1px rgba(255, 40, 60, 0.08) inset,
      0 0 40px rgba(255, 40, 60, 0.15),
      0 0 80px rgba(255, 40, 60, 0.06);
    position: relative;
    overflow: hidden;
    animation: cardPulse 3s ease-in-out infinite;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 40, 60, 0.9) 50%,
      transparent 100%
    );
  }
  /* Garis dekoratif di kiri & kanan card */
  #card::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 20%;
    right: 20%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 40, 60, 0.5),
      transparent
    );
  }
  @keyframes cardPulse {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255, 40, 60, 0.08) inset,
        0 0 30px rgba(255, 40, 60, 0.12),
        0 0 60px rgba(255, 40, 60, 0.05);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255, 40, 60, 0.15) inset,
        0 0 50px rgba(255, 40, 60, 0.25),
        0 0 100px rgba(255, 40, 60, 0.10);
    }
  }

  /* ===== STATE TEXT (tanpa spinner) ===== */
  #state {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    margin: 0 0 14px;
    color: var(--amber);
    text-shadow:
      0 0 8px rgba(255, 159, 28, 0.9),
      0 0 20px rgba(255, 159, 28, 0.5);
    animation: statePulse 2.4s ease-in-out infinite;
    text-transform: uppercase;
    line-height: 1.4;
  }
  @keyframes statePulse {
    0%, 100% {
      color: var(--amber);
      text-shadow:
        0 0 8px rgba(255, 159, 28, 0.9),
        0 0 20px rgba(255, 159, 28, 0.5);
    }
    50% {
      color: var(--amber-2);
      text-shadow:
        0 0 12px rgba(255, 159, 28, 1),
        0 0 32px rgba(255, 159, 28, 0.8),
        0 0 48px rgba(255, 159, 28, 0.4);
    }
  }

  /* State colors override */
  #state.ok   {
    color: var(--ok);
    text-shadow: 0 0 10px rgba(74, 222, 128, 0.9), 0 0 24px rgba(74, 222, 128, 0.5);
    animation: none;
  }
  #state.bad  {
    color: var(--bad);
    text-shadow: 0 0 10px rgba(255, 77, 94, 1), 0 0 24px rgba(255, 77, 94, 0.7);
    animation: none;
  }
  #state.warn {
    color: var(--amber);
    text-shadow: 0 0 10px rgba(255, 159, 28, 1), 0 0 24px rgba(255, 159, 28, 0.7);
  }

  /* Hint "klik X" — dengan animasi tap */
  #state.tap {
    animation: tapPulse 1.5s ease-in-out infinite;
  }
  @keyframes tapPulse {
    0%, 100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.7;
      transform: scale(1.03);
    }
  }

  #det {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
    letter-spacing: 0.04em;
    line-height: 1.5;
  }
  #det b {
    color: #ffffff;
    font-weight: 700;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 16px rgba(255, 40, 60, 0.5);
  }

  #cache {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
    min-height: 16px;
    letter-spacing: 0.06em;
  }
  #cache.cacheok {
    color: var(--accent-2);
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 16px rgba(255, 40, 60, 0.5);
  }

  /* Hint kecil di bawah card */
  #hint {
    font-size: 11px;
    color: var(--dim);
    margin-top: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #hint b {
    color: var(--amber);
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 159, 28, 0.7);
  }

  /* ===== FOOTER ===== */
  #footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 12px 14px 14px;
    font-size: 11px;
    letter-spacing: 0.06em;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.6);
    background: rgba(5, 7, 10, 0.85);
    border-top: 1px solid rgba(255, 40, 60, 0.25);
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #footer b {
    color: #ffffff;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 40, 60, 0.6);
  }
  #footer .row {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #footer .sep {
    color: rgba(255, 40, 60, 0.7);
    margin: 0 5px;
  }
  #footer a {
    color: #ffffff;
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 40, 60, 0.6);
    text-shadow: 0 0 6px rgba(255, 40, 60, 0.5);
    transition: color 0.2s, border-color 0.2s;
  }
  #footer a:hover {
    color: var(--accent-2);
    border-bottom-color: var(--accent-2);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 560px), (max-height: 600px) {
    #wrap { padding: 16px 12px; }
    #card { padding: 26px 18px 22px; }
    #state { font-size: 18px; }
    #brand b { font-size: 16px; }
    #brand img { width: 32px; height: 32px; }
    #footer { font-size: 10px; padding: 8px 10px 10px; }
    #footer .row { white-space: normal; }
  }
</style>
</head>
<body>

<div id="brand">
  <div id="brand-inner">
    <img src="logo.png" alt="PlayBox Sidoarjo">
    <div>
      <b>WEBKIT PLAYBOX SIDOARJO</b>
      <span class="sub">PS4 Host &middot; 13.02 - 13.52 &middot; GoldHEN 2.4B18.12</span>
    </div>
  </div>
</div>

<div id="wrap">
  <div id="card">
    <div id="state">memeriksa firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="hint">DILARANG MENGONEKSIKAN PS4 KE INTERNET..!!</div>
  </div>
</div>

<div id="footer">
  <span class="row">
    Author <b>&copy; 2026 playbox sidoarjo</b>
    <span class="sep">·</span>
    GoldHEN <b>v2.4b18.12</b>
    <span class="sep">·</span>
    Credit <b>raw13g</b>
  </span>
  <span class="row">
    Kontak
    <a href="https://wa.me/6285943796979">WA 085943796979</a>
    <span class="sep">·</span>
    TikTok <a href="https://www.tiktok.com/@playbox.sidoarjo">playbox.sidoarjo</a>
    <span class="sep">·</span>
    IG <a href="https://www.instagram.com/playbox.sidoarjo">playbox.sidoarjo</a>
  </span>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var hintEl = document.getElementById("hint");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function showHint(v) { hintEl.style.display = v ? "block" : "none"; }

    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for.
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>didukung</b>"
                     : " &middot; belum teruji di build ini");

    var target = "jb.html" + location.search;

    // WAJIB KLIK X / TAP
    function waitForTap(msg, action) {
        setState(msg, "warn tap");
        showHint(true);
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            showHint(false);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    function go() {
        setState("memuat jailbreak...", "warn");
        location.replace(target);
    }

    // Cek firmware dulu
    if (!supported) {
        setState("FIRMWARE BELUM TERUJI", "bad");
        waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        return;
    }

    // Firmware didukung → cek cache → SELALU minta klik X
    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("cache tidak tersedia");
        setState("SIAP DIMULAI", "ok");
        waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
    } else if (!navigator.onLine) {
        setCache("offline -- dari cache", true);
        setState("SIAP DIMULAI", "ok");
        waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
    } else if (ac.status === ac.IDLE) {
        setCache("siap offline", true);
        setState("SIAP DIMULAI", "ok");
        waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update terunduh", true);
        setState("SIAP DIMULAI", "ok");
        waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
    } else {
        // Sedang menyimpan cache
        setCache("menyimpan cache...");
        setState("MENYIMPAN CACHE...", "warn");
        showHint(false);

        ac.addEventListener("downloading",
            function () { setCache("menyimpan cache (pertama kali)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("menyimpan cache " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("tersimpan untuk offline", true);
            setState("SIAP DIMULAI", "ok");
            waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update terunduh", true);
            setState("SIAP DIMULAI", "ok");
            waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("siap offline", true);
            setState("SIAP DIMULAI", "ok");
            waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache gagal");
            setState("SIAP DIMULAI", "ok");
            waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache usang");
            setState("SIAP DIMULAI", "ok");
            waitForTap("TEKAN X UNTUK MEMBUKA KUNCI GAME", go);
        }, false);
    }
})();
</script>

</body>
</html>
