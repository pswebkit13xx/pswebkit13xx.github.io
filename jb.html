<!doctype html>
<html lang="id" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PLAYBOX SIDOARJO</title>
    <style>
      :root {
        --bg: #05070a;
        --bg-2: #0a0d12;
        --card: #0e1118;
        --card-2: #131820;
        --line: #1e2630;
        --line-bright: #2e3846;
        --text: #ffffff;
        --muted: #8b95a3;
        --dim: #5c6672;
        --accent: #ff283c;
        --accent-2: #ff6b7a;
        --amber: #ff9f1c;      /* kuning-orange untuk teks tunggu */
        --amber-2: #ffb84d;    /* lebih terang untuk glow */
        --ok: #4ade80;         /* hijau untuk sukses */
        --warn: #fbbf24;
        --bad: #ff4d5e;        /* merah untuk gagal */
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }

      body {
        background-image:
          radial-gradient(circle at 15% 10%, rgba(255, 40, 60, 0.12), transparent 42%),
          radial-gradient(circle at 85% 90%, rgba(255, 0, 80, 0.10), transparent 42%),
          radial-gradient(circle at 50% 50%, rgba(255, 60, 0, 0.06), transparent 60%),
          linear-gradient(rgba(255, 40, 60, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 40, 60, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        background-attachment: fixed;
      }

      /* Scanline effect */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 40, 60, 0.02) 0px,
          rgba(255, 40, 60, 0.02) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 1;
      }

      /* ===== HEADER ===== */
      #brand {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 14px 12px 12px;
        background: rgba(8, 8, 12, 0.85);
        border-bottom: 1px solid rgba(255, 40, 60, 0.35);
        box-shadow: 0 0 32px rgba(255, 40, 60, 0.15);
      }
      #brand-inner {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      #brand img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        filter: drop-shadow(0 0 8px rgba(255, 40, 60, 0.7));
        animation: logoPulse 3s ease-in-out infinite;
      }
      @keyframes logoPulse {
        0%, 100% {
          box-shadow:
            0 0 12px rgba(255, 40, 60, 0.5),
            0 0 24px rgba(255, 40, 60, 0.2);
        }
        50% {
          box-shadow:
            0 0 20px rgba(255, 40, 60, 0.9),
            0 0 40px rgba(255, 40, 60, 0.4);
        }
      }
      #brand-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      #brand b {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #ffffff;
        text-shadow:
          0 0 8px rgba(255, 40, 60, 0.9),
          0 0 18px rgba(255, 40, 60, 0.5);
        line-height: 1.1;
      }
      #brand .sub {
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--muted);
        text-transform: uppercase;
      }
      #brand::after {
        content: "";
        display: block;
        height: 1px;
        margin-top: 10px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 40, 60, 0.7) 50%,
          transparent 100%
        );
      }

      /* ===== CARD TENGAH ===== */
      #centerWrap {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        padding: 0 18px;
        z-index: 2;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      #card {
        width: 100%;
        max-width: 520px;
        text-align: center;
        border: 1px solid rgba(255, 40, 60, 0.35);
        border-radius: 16px;
        padding: 36px 24px 30px;
        background: linear-gradient(
          180deg,
          rgba(14, 17, 24, 0.95) 0%,
          rgba(10, 8, 12, 0.9) 100%
        );
        box-shadow:
          0 0 0 1px rgba(255, 40, 60, 0.08) inset,
          0 0 40px rgba(255, 40, 60, 0.15),
          0 0 80px rgba(255, 40, 60, 0.06);
        position: relative;
        overflow: hidden;
        animation: cardPulse 3s ease-in-out infinite;
        pointer-events: auto;
      }

      #card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 40, 60, 0.9) 50%,
          transparent 100%
        );
      }

      @keyframes cardPulse {
        0%, 100% {
          box-shadow:
            0 0 0 1px rgba(255, 40, 60, 0.08) inset,
            0 0 30px rgba(255, 40, 60, 0.12),
            0 0 60px rgba(255, 40, 60, 0.05);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(255, 40, 60, 0.15) inset,
            0 0 50px rgba(255, 40, 60, 0.25),
            0 0 100px rgba(255, 40, 60, 0.10);
        }
      }

      /* ===== SPINNER (warna amber biar nyatu sama teks tunggu) ===== */
      #spin {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border: 4px solid rgba(255, 159, 28, 0.15);
        border-top-color: var(--amber);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        filter: drop-shadow(0 0 10px rgba(255, 159, 28, 0.8));
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ===== TEKS TUNGGU (AMBER / KUNING-ORANGE) ===== */
      #waitText {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.10em;
        color: var(--amber);
        line-height: 1.5;
        text-shadow:
          0 0 8px rgba(255, 159, 28, 0.9),
          0 0 20px rgba(255, 159, 28, 0.5);
        animation: waitPulse 2.4s ease-in-out infinite;
      }
      @keyframes waitPulse {
        0%, 100% {
          color: var(--amber);
          text-shadow:
            0 0 8px rgba(255, 159, 28, 0.9),
            0 0 20px rgba(255, 159, 28, 0.5);
        }
        50% {
          color: var(--amber-2);
          text-shadow:
            0 0 12px rgba(255, 159, 28, 1),
            0 0 32px rgba(255, 159, 28, 0.8),
            0 0 48px rgba(255, 159, 28, 0.4);
        }
      }

      /* ===== IKON STATUS ===== */
      #okMsg, #failMsg {
        display: none;
      }
      #okMsg .icon, #failMsg .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 900;
        line-height: 1;
        animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes iconPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Ikon SUKSES → HIJAU */
      #okMsg .icon {
        background: rgba(74, 222, 128, 0.1);
        border: 2px solid var(--ok);
        color: var(--ok);
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
      }

      /* Ikon GAGAL → MERAH */
      #failMsg .icon {
        background: rgba(255, 77, 94, 0.1);
        border: 2px solid var(--bad);
        color: var(--bad);
        box-shadow: 0 0 30px rgba(255, 77, 94, 0.5);
      }

      #okMsg .big, #failMsg .big {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.06em;
        margin-bottom: 14px;
        text-transform: uppercase;
      }

      /* Big text SUKSES → HIJAU */
      #okMsg .big {
        color: var(--ok);
        text-shadow:
          0 0 10px rgba(74, 222, 128, 1),
          0 0 26px rgba(74, 222, 128, 0.7);
      }

      /* Big text GAGAL → MERAH */
      #failMsg .big {
        color: var(--bad);
        text-shadow:
          0 0 10px rgba(255, 77, 94, 1),
          0 0 26px rgba(255, 77, 94, 0.7);
      }

      #okMsg .small, #failMsg .small {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.6;
        max-width: 380px;
        margin: 0 auto;
      }
      #okMsg .small b, #failMsg .small b {
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 40, 60, 0.7);
      }

      /* STATE: tampilkan sesuai body.className */
      body.done  #okMsg   { display: block; }
      body.fail  #failMsg { display: block; }
      body.log   #okMsg,
      body.log   #failMsg { display: none; }

      body.done #spin,
      body.fail #spin { display: none; }

      body.done #waitText,
      body.fail #waitText,
      body.log  #waitText { display: none; }

      /* ===== MODE LOG (?log=1) ===== */
      #wrap {
        position: relative;
        z-index: 2;
        padding: 0;
      }
      #state, #out {
        display: none;
      }
      body.log #centerWrap { display: none; }
      body.log #wrap { padding: 14px 18px; }
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
        color: #ffffff;
        text-transform: uppercase;
        text-shadow:
          0 0 8px rgba(255, 40, 60, 0.9),
          0 0 20px rgba(255, 40, 60, 0.5);
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.55 Consolas, "Courier New", monospace;
        background: rgba(6, 8, 11, 0.95);
        border: 1px solid rgba(255, 40, 60, 0.35);
        border-radius: 10px;
        padding: 14px;
        height: calc(100vh - 160px);
        overflow-y: auto;
        color: #a8b3c2;
        box-shadow: 0 0 24px rgba(255, 40, 60, 0.12);
      }
      body.log #out::-webkit-scrollbar {
        width: 8px;
      }
      body.log #out::-webkit-scrollbar-track {
        background: rgba(255, 40, 60, 0.05);
      }
      body.log #out::-webkit-scrollbar-thumb {
        background: rgba(255, 40, 60, 0.4);
        border-radius: 4px;
      }

      .ok     { color: #4ade80; }
      .bad    { color: #ff4d5e; }
      .warn   { color: #fbbf24; }
      .safe   { color: #4ade80; }
      .danger { color: #ff4d5e; }
      code    { color: #a8b3c2; }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 560px), (max-height: 600px) {
        #card { padding: 28px 18px 22px; }
        #spin { width: 52px; height: 52px; margin-bottom: 18px; }
        #waitText { font-size: 16px; }
        #okMsg .big, #failMsg .big { font-size: 19px; }
        #okMsg .small, #failMsg .small { font-size: 13px; }
        #okMsg .icon, #failMsg .icon { width: 60px; height: 60px; font-size: 32px; }
        #brand b { font-size: 16px; }
        #brand img { width: 32px; height: 32px; }
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div id="brand-inner">
        <img src="logo.png" alt="PlayBox Sidoarjo" />
        <div id="brand-text">
          <b>WEBKIT PLAYBOX SIDOARJO</b>
          <span class="sub">PS4 Host &middot; 13.02 - 13.52 &middot; GoldHEN 2.4B18.12</span>
        </div>
      </div>
    </div>

    <div id="centerWrap">
      <div id="card">
        <div id="spin"></div>
        <div id="waitText">MOHON DITUNGGU, PS4 PROSES MEMBUKA GAME YANG TERKUNCI..!</div>

        <div id="okMsg">
          <div class="icon">✓</div>
          <div class="big">Proses Berhasil..!</div>
          <div class="small">Silahkan keluar dari browser dengan klik tombol <b>O</b> pada controller</div>
        </div>

        <div id="failMsg">
          <div class="icon">✕</div>
          <div class="big">Proses Gagal..!</div>
          <div class="small">Mohon restart PS4, kemudian jalankan ulang prosesnya</div>
        </div>
      </div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
